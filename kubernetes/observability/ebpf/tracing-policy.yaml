apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: opsforge-exec-monitor
spec:
  kprobes:
  - call: "sys_execve"
    syscall: true
    args:
    - index: 0
      type: "string"
    selectors:
    - matchPIDs:
      - operator: "NotEq"
        values:
        - 1
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/bin/"
        - "/usr/bin/"
        - "/sbin/"
        - "/usr/sbin/"
