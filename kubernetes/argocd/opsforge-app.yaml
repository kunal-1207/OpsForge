apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opsforge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/kunal-1207/OpsForge.git'
    targetRevision: HEAD
    path: kubernetes/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
