apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.opsforge.io
spec:
  group: opsforge.io
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    singular: application
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                  description: "Container image to deploy"
                replicas:
                  type: integer
                  minimum: 1
                  description: "Number of replicas"
                port:
                  type: integer
                  description: "Port exposed by the application"
                environment:
                  type: string
                  description: "Target environment (e.g., development, production)"
                autoscaling:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    minReplicas:
                      type: integer
                    maxReplicas:
                      type: integer
              required:
                - image
                - replicas
                - environment
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current phase of the application"
                availableReplicas:
                  type: integer
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .spec.environment
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
