name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          app/api-service/package-lock.json
          app/worker-service/package-lock.json

    - name: Install dependencies for API service
      run: |
        cd app/api-service
        npm ci

    - name: Run linting for API service
      run: |
        cd app/api-service
        npm run lint

    - name: Run tests for API service
      run: |
        cd app/api-service
        npm test

    - name: Install dependencies for Worker service
      run: |
        cd app/worker-service
        npm ci

    - name: Run linting for Worker service
      run: |
        cd app/worker-service
        npm run lint

    - name: Run tests for Worker service
      run: |
        cd app/worker-service
        npm test
