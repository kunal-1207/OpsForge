name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}-api
  IMAGE_NAME_WORKER: ${{ github.repository }}-worker

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for API service
      id: meta-api
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}

    - name: Extract metadata for Worker service
      id: meta-worker
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}

    - name: Build and push API service
      id: build-api
      uses: docker/build-push-action@v5
      with:
        context: ./app/api-service
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Worker service
      id: build-worker
      uses: docker/build-push-action@v5
      with:
        context: ./app/worker-service
        push: true
        tags: ${{ steps.meta-worker.outputs.tags }}
        labels: ${{ steps.meta-worker.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Print image digest for API service
      run: echo API Service Image Digest: ${{ steps.build-api.outputs.digest }}

    - name: Print image digest for Worker service
      run: echo Worker Service Image Digest: ${{ steps.build-worker.outputs.digest }}

  deploy-dev:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event.workflow_run.head_branch == 'develop' }}
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Set up kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy to Dev using Kustomize
      run: |
        cd k8s/overlays/dev
        kustomize edit set image ghcr.io/${{ github.repository }}-api:${{ github.event.workflow_run.head_sha }}=ghcr.io/${{ github.repository }}-api:${{ github.event.workflow_run.head_sha }}
        kustomize edit set image ghcr.io/${{ github.repository }}-worker:${{ github.event.workflow_run.head_sha }}=ghcr.io/${{ github.repository }}-worker:${{ github.event.workflow_run.head_sha }}
        kubectl apply -k . --timeout=10m

  deploy-prod:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Set up kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy to Prod using Kustomize
      run: |
        cd k8s/overlays/prod
        kustomize edit set image ghcr.io/${{ github.repository }}-api:${{ github.event.workflow_run.head_sha }}=ghcr.io/${{ github.repository }}-api:${{ github.event.workflow_run.head_sha }}
        kustomize edit set image ghcr.io/${{ github.repository }}-worker:${{ github.event.workflow_run.head_sha }}=ghcr.io/${{ github.repository }}-worker:${{ github.event.workflow_run.head_sha }}
        kubectl apply -k . --timeout=10m
